name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Redundant PR runs are pointless, so cancel them. Pushes to main are NOT
# cancelled - killing a run mid-deploy would leave the service half-updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DEPLOY_HOST: 87.106.19.210
  DEPLOY_USER: viktor
  SITE_URL: https://www.playr.viktorradman.se

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Playr.sln

      - name: Build
        run: dotnet build Playr.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Playr.sln --configuration Release --no-build --verbosity normal

  deploy:
    name: Deploy to production
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check required secrets are present
        # Writing an env file from an empty secret would silently break production
        # (an empty Jwt__SigningKey fails startup validation, an empty database
        # connection string fails migrations). Fail loudly here instead.
        #
        # Secrets are named after the .NET configuration keys they populate
        # (double underscore = nested config section), so this list must be
        # kept in sync with the "Build environment file" step below.
        env:
          ASPNETCORE_ENVIRONMENT: ${{ secrets.ASPNETCORE_ENVIRONMENT }}
          ASPNETCORE_URLS: ${{ secrets.ASPNETCORE_URLS }}
          CONNECTIONSTRINGS__DEFAULTCONNECTION: ${{ secrets.CONNECTIONSTRINGS__DEFAULTCONNECTION }}
          EMAIL__FROMADDRESS: ${{ secrets.EMAIL__FROMADDRESS }}
          EMAIL__FROMNAME: ${{ secrets.EMAIL__FROMNAME }}
          EMAIL__HOST: ${{ secrets.EMAIL__HOST }}
          EMAIL__PASSWORD: ${{ secrets.EMAIL__PASSWORD }}
          EMAIL__PORT: ${{ secrets.EMAIL__PORT }}
          EMAIL__USERNAME: ${{ secrets.EMAIL__USERNAME }}
          EMAIL__USESTARTTLS: ${{ secrets.EMAIL__USESTARTTLS }}
          FILESTORAGE__ROOTPATH: ${{ secrets.FILESTORAGE__ROOTPATH }}
          FRONTEND__BASEURL: ${{ secrets.FRONTEND__BASEURL }}
          JWT__AUDIENCE: ${{ secrets.JWT__AUDIENCE }}
          JWT__EXPIRATIONMINUTES: ${{ secrets.JWT__EXPIRATIONMINUTES }}
          JWT__ISSUER: ${{ secrets.JWT__ISSUER }}
          JWT__SIGNINGKEY: ${{ secrets.JWT__SIGNINGKEY }}
          RAWG__APIKEY: ${{ secrets.RAWG__APIKEY }}
          STEAM__APIKEY: ${{ secrets.STEAM__APIKEY }}
          STEAM__SYNCINTERVALHOURS: ${{ secrets.STEAM__SYNCINTERVALHOURS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=''
          for name in ASPNETCORE_ENVIRONMENT ASPNETCORE_URLS CONNECTIONSTRINGS__DEFAULTCONNECTION \
            EMAIL__FROMADDRESS EMAIL__FROMNAME EMAIL__HOST EMAIL__PASSWORD EMAIL__PORT EMAIL__USERNAME EMAIL__USESTARTTLS \
            FILESTORAGE__ROOTPATH FRONTEND__BASEURL JWT__AUDIENCE JWT__EXPIRATIONMINUTES JWT__ISSUER JWT__SIGNINGKEY \
            RAWG__APIKEY STEAM__APIKEY STEAM__SYNCINTERVALHOURS SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing required secrets:$missing"
            exit 1
          fi

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinning the host key. StrictHostKeyChecking=no would leave the
          # deploy open to man-in-the-middle.
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Build environment file
        # printf with quoted variables, not a heredoc: secret values may contain
        # '$', backticks or backslashes, which an unquoted heredoc would expand.
        #
        # Each secret is named exactly after the config key it populates, so it
        # can be written straight into the env file as KEY=value.
        env:
          ASPNETCORE_ENVIRONMENT: ${{ secrets.ASPNETCORE_ENVIRONMENT }}
          ASPNETCORE_URLS: ${{ secrets.ASPNETCORE_URLS }}
          CONNECTIONSTRINGS__DEFAULTCONNECTION: ${{ secrets.CONNECTIONSTRINGS__DEFAULTCONNECTION }}
          EMAIL__FROMADDRESS: ${{ secrets.EMAIL__FROMADDRESS }}
          EMAIL__FROMNAME: ${{ secrets.EMAIL__FROMNAME }}
          EMAIL__HOST: ${{ secrets.EMAIL__HOST }}
          EMAIL__PASSWORD: ${{ secrets.EMAIL__PASSWORD }}
          EMAIL__PORT: ${{ secrets.EMAIL__PORT }}
          EMAIL__USERNAME: ${{ secrets.EMAIL__USERNAME }}
          EMAIL__USESTARTTLS: ${{ secrets.EMAIL__USESTARTTLS }}
          FILESTORAGE__ROOTPATH: ${{ secrets.FILESTORAGE__ROOTPATH }}
          FRONTEND__BASEURL: ${{ secrets.FRONTEND__BASEURL }}
          JWT__AUDIENCE: ${{ secrets.JWT__AUDIENCE }}
          JWT__EXPIRATIONMINUTES: ${{ secrets.JWT__EXPIRATIONMINUTES }}
          JWT__ISSUER: ${{ secrets.JWT__ISSUER }}
          JWT__SIGNINGKEY: ${{ secrets.JWT__SIGNINGKEY }}
          RAWG__APIKEY: ${{ secrets.RAWG__APIKEY }}
          STEAM__APIKEY: ${{ secrets.STEAM__APIKEY }}
          STEAM__SYNCINTERVALHOURS: ${{ secrets.STEAM__SYNCINTERVALHOURS }}
        run: |
          set -euo pipefail
          umask 077
          {
            printf 'ASPNETCORE_ENVIRONMENT=%s\n' "$ASPNETCORE_ENVIRONMENT"
            printf 'ASPNETCORE_URLS=%s\n' "$ASPNETCORE_URLS"
            printf 'ConnectionStrings__DefaultConnection=%s\n' "$CONNECTIONSTRINGS__DEFAULTCONNECTION"
            printf 'Jwt__Issuer=%s\n' "$JWT__ISSUER"
            printf 'Jwt__Audience=%s\n' "$JWT__AUDIENCE"
            printf 'Jwt__SigningKey=%s\n' "$JWT__SIGNINGKEY"
            printf 'Jwt__ExpirationMinutes=%s\n' "$JWT__EXPIRATIONMINUTES"
            printf 'Steam__ApiKey=%s\n' "$STEAM__APIKEY"
            printf 'Steam__SyncIntervalHours=%s\n' "$STEAM__SYNCINTERVALHOURS"
            printf 'Rawg__ApiKey=%s\n' "$RAWG__APIKEY"
            printf 'FileStorage__RootPath=%s\n' "$FILESTORAGE__ROOTPATH"
            printf 'Frontend__BaseUrl=%s\n' "$FRONTEND__BASEURL"
            printf 'Email__Host=%s\n' "$EMAIL__HOST"
            printf 'Email__Port=%s\n' "$EMAIL__PORT"
            printf 'Email__Username=%s\n' "$EMAIL__USERNAME"
            printf 'Email__Password=%s\n' "$EMAIL__PASSWORD"
            printf 'Email__FromAddress=%s\n' "$EMAIL__FROMADDRESS"
            printf 'Email__FromName=%s\n' "$EMAIL__FROMNAME"
            printf 'Email__UseStartTls=%s\n' "$EMAIL__USESTARTTLS"
          } > playr-api.env

          # Guard against a value containing a newline, which would corrupt every
          # following line when systemd reads the file.
          expected=19
          actual=$(wc -l < playr-api.env)
          if [ "$actual" -ne "$expected" ]; then
            echo "Environment file has $actual lines, expected $expected. A secret probably contains a newline."
            exit 1
          fi

      - name: Upload environment file
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            playr-api.env "$DEPLOY_USER@$DEPLOY_HOST:~/apps/playr-api.env"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'chmod 600 ~/apps/playr-api.env'

      - name: Deploy
        # The script pulls the repo, publishes, applies EF migrations, restarts
        # the service and health-checks it locally.
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd ~/apps/playr-api-src && ./deploy/deploy-backend.sh'

      - name: Smoke check
        run: |
          set -euo pipefail
          type=$(curl -sS -o /dev/null -w '%{content_type}' "$SITE_URL/api/games")
          echo "GET /api/games -> $type"
          case "$type" in
            application/json*) ;;
            *) echo "API is not returning JSON"; exit 1 ;;
          esac

      - name: Clean up secrets
        if: always()
        run: rm -f ~/.ssh/id_ed25519 playr-api.env
